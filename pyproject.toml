[project]
name = "jetson-imu-tui"
version = "0.1.0"
description = "Headless web server for streaming, recording, and browser-plotting two BNO055 IMUs on the Jetson"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "flask>=3,<4",
    # Official Bosch BNO055 driver + CircuitPython compat layer (Blinka), reading the
    # chip's onboard fusion directly. ExtendedI2C selects the I2C bus by number (1, 7).
    "adafruit-circuitpython-bno055>=5.4.0",
    "adafruit-extended-bus>=1.0.2",
    "Adafruit-Blinka>=8.0.0",
    "loguru>=0.7,<1",
    "numpy>=1.21,<2",
    # TOML parsing on Python 3.10; tomllib is stdlib from 3.11 onward
    "tomli>=2; python_version < '3.11'",
    # read_serial / serial_service: binary frames from an Arduino or Simulink model. A core
    # dependency rather than an extra because [source] kind = "serial" is a supported boot
    # default and a missing source at startup is a hard exit, not a fallback.
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Real-time CLS inference. On the Jetson, torch is installed from NVIDIA's wheels rather
# than PyPI, so it is an optional extra, not a hard dependency. CLS self-disables if absent.
cls = ["torch>=2"]
# Kept so `pip install .[serial]` in existing scripts and docs still resolves; pyserial is a
# core dependency now, so this extra adds nothing.
serial = ["pyserial>=3.5"]

[project.scripts]
jetson-imu-tui = "jetson_imu_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetson_imu_tui"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
