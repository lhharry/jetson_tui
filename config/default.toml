[buses]                   # only used when [source] kind = "i2c"
1 = "Right"
7 = "Left"

[source]                  # boot default; the web UI can switch kinds at runtime (session only)
kind = "i2c"              # "i2c" = BNO055 over I2C (see [buses]) | "serial" = binary frames from an Arduino/Simulink
port = "/dev/ttyACM0"     # serial only; on Windows something like "COM17"
baud = 115200
label = "Left"            # label the serial IMU appears under; must match [cls] sensor
magic = "aa55"            # frame header in hex; required unless the layout carries a timestamp
layout = "gyro_accel"     # frame contents, see read_serial.LAYOUTS:
                          #   accel_gyro_t  ax ay az gx gy gz t   (7 floats, Simulink)
                          #   gyro_accel_t  gx gy gz ax ay az t   (7 floats)
                          #   accel_gyro    ax ay az gx gy gz     (6 floats, no clock)
                          #   gyro_accel    gx gy gz ax ay az     (6 floats, no clock)
                          # Channel order cannot be detected from the bytes: getting it wrong
                          # puts gravity in the gyro channels and degrades CLS silently.
gyro_units = "rad"        # units the device sends: "deg" is scaled to rad/s, "rad" passes through
sample_hz = 80            # rate the device sends at (measured 79.7 Hz); omit to inherit
                          # [defaults] sample_hz. Drives the CLS decimation, so it must divide
                          # [cls] target_hz evenly — 80/10 = 8. The serial reader logs the
                          # observed rate on connect, so check it against this value.

[defaults]
log_dir = "./logs"
sample_hz = 100           # sampler-thread rate per sensor (BNO055 fusion is fixed at 100 Hz)
plot_fps = 15             # browser poll rate; each poll now fetches the full sample batch
plot_window_seconds = 10  # rolling time window shown in the plots
record_hz = 100           # buffer drain cadence; CSV data rate follows sample_hz (no dup/skip)
web_host = "::"           # bind host: "::" = IPv6+IPv4 dual-stack; "0.0.0.0" = IPv4 only
web_port = 8000           # server port

[cls]                     # real-time activity classification (CLS page)
enabled = true            # master switch; CLS also self-disables if torch/checkpoint missing
model_path = "src/jetson_imu_tui/cls/model/model.pt"           # BERT-finetune jetson_leg .pt, 11-class label map ids 0..10 (see README → CLS and cls/model/__init__.py CLASSES)
sensor = "Left"           # which IMU label to classify (single-IMU model)
target_hz = 10            # sampling rate feeding the model (matches training 10 Hz); sample_hz must be an integer multiple, or CLS self-disables
window = 20               # samples per inference window (2 s @ 10 Hz)
stride = 1                # emit a new prediction every N samples (1 = every 100 ms, sliding)

[cls.vote]                # temporal aggregation: noisy 10 Hz frames -> one stable decision.
                          # The decision is what the UI banner shows, what cls_vote.csv records,
                          # and the only thing sent back over serial as a class-index byte.
                          # Decision rate = target_hz / (stride * emit_every) = 2 Hz below.
enabled = true            # false = passthrough (one decision per inference, as before)
window = 5                # frames averaged per decision
emit_every = 5            # frames between decisions; == window -> non-overlapping windows,
                          # < window -> sliding (e.g. window 10 / emit_every 5 is steadier)
hysteresis = 0            # 0 = switch as soon as the vote does; n > 1 = require n consecutive
                          # windows to agree before the output class changes
