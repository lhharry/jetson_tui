[buses]                   # only used when [source] kind = "i2c"
1 = "Right"
7 = "Left"

[source]                  # boot default; the web UI can switch kinds at runtime (session only)
kind = "serial"           # "i2c" = BNO055 over I2C (see [buses]) | "serial" = binary frames from an Arduino/Simulink
port = "/dev/ttyACM0"     # serial only; on Windows something like "COM17"
baud = 115200
label = "Left"            # label the serial IMU appears under; must match [cls] sensor
magic = "aa55"            # frame header in hex; required unless the layout carries a timestamp
layout = "exo_v1"         # frame contents, see read_serial.LAYOUTS. A layout is an ordered
                          # list of channel BLOCKS, so a wider frame is one more table row:
                          #   accel_gyro_t  ax ay az gx gy gz t   (7 floats, Simulink)
                          #   gyro_accel_t  gx gy gz ax ay az t   (7 floats)
                          #   accel_gyro    ax ay az gx gy gz     (6 floats, no clock)
                          #   gyro_accel    gx gy gz ax ay az     (6 floats, no clock)
                          #   exo_v1        the full rig uplink   (23 floats = 94 B w/ header):
                          #                 enable | gx gy gz | ax ay az
                          #                 | ang_r vel_r ang_l vel_l
                          #                 | pos_r speed_r torque_r pos_l speed_l torque_l
                          #                 | finalClass LU_AVEL_F L_KVEL L_KWRAP MotorCom_L
                          #                 | t_src
                          # Switch to exo_v1 only once the device sends that frame — the two
                          # lengths are not multiples, so a mismatch never aligns and the UI
                          # just shows "(no data)". The reader logs a hint after 5 s, and
                          # `others/tools/serial_monitor.py --layout exo_v1` checks it directly.
                          # Channel order cannot be detected from the bytes: getting it wrong
                          # puts gravity in the gyro channels and degrades CLS silently.
gyro_units = "deg"        # units the device sends: "deg" is scaled to rad/s, "rad" passes through
sample_hz = 80            # rate the device sends at. MEASURED VALUE, not the nominal one:
                          # it drives the CLS decimation (decim = sample_hz / [cls] target_hz),
                          # so configuring 100 while the device sends 80 stretches every model
                          # window by 25% with no error anywhere. Must divide target_hz evenly
                          # — 80/10 = 8, 100/10 = 10, 200/10 = 20 are all fine; 90 is not.
                          # 79.7 Hz was measured with the model's WiFi UDP telemetry still in
                          # the loop. That block is gone now, which frees 1-5 ms of the 10 ms
                          # step, so RE-MEASURE: the reader logs the rate a few seconds after
                          # connecting and the page shows it next to the poll rate.

[axis]                    # host-side axis remap, applied to BOTH sources (I2C and serial).
                          # Replaces the old BNO055 AXIS_MAP_CONFIG/SIGN register writes: the
                          # chip stays at its P1 identity default and the permutation happens
                          # here, so the serial source can use it too and nothing is lost on a
                          # power cycle.
ops = []                  # applied in list order, e.g. ["rot_x_90", "flip_z"]. Rotations turn
                          # the READINGS by the given angle (right-hand rule): rot_x_90 sends
                          #   (x, y, z) -> (x, -z, y)
                          # Names: rot_{x,y,z}_{90,180,270} and flip_{x,y,z}.
                          # This is only the boot DEFAULT — a mapping applied from the web UI
                          # is saved to <log_dir>/axis_remap.json and wins at startup. Delete
                          # that file to fall back to this list.
                          # An odd number of flips is a mirror: accel/gyro still follow it, but
                          # quaternion/euler cannot and are passed through unchanged.
                          # MUST match the mapping the CLS training data was captured with.

[defaults]
log_dir = "./logs"
sample_hz = 100           # sampler-thread rate per sensor (BNO055 fusion is fixed at 100 Hz)
plot_fps = 15             # browser poll rate; each poll now fetches the full sample batch
plot_window_seconds = 10  # rolling time window shown in the plots
record_hz = 100           # buffer drain cadence; CSV data rate follows sample_hz (no dup/skip)
web_host = "127.0.0.1"    # bind host. Loopback by default: a Jetson in the field exposes
                          # nothing, and a laptop reaches the UI over an ssh tunnel (the
                          # startup banner prints the command). Pass --lan, or set "::" here,
                          # to serve the network instead; "0.0.0.0" is IPv4 only.
web_port = 8000           # server port

[cls]                     # real-time activity classification (CLS page)
enabled = true            # master switch; CLS also self-disables if torch/checkpoint missing
model_path = "src/jetson_imu_tui/cls/model/model.pt"           # BERT-finetune jetson_leg .pt, 11-class label map ids 0..10 (see README → CLS and cls/model/__init__.py CLASSES)
sensor = "Left"           # which IMU label to classify (single-IMU model)
target_hz = 10            # sampling rate feeding the model (matches training 10 Hz); sample_hz must be an integer multiple, or CLS self-disables
window = 20               # samples per inference window (2 s @ 10 Hz)
stride = 1                # emit a new prediction every N samples (1 = every 100 ms, sliding)

[cls.vote]                # temporal aggregation: noisy 10 Hz frames -> one stable decision.
                          # The decision is what the UI banner shows, what cls_vote.csv records,
                          # and the only thing sent back over serial as a class-index byte.
                          # Decision rate = target_hz / (stride * emit_every) = 2 Hz below.
enabled = true            # false = passthrough (one decision per inference, as before)
window = 5                # frames averaged per decision
emit_every = 5            # frames between decisions; == window -> non-overlapping windows,
                          # < window -> sliding (e.g. window 10 / emit_every 5 is steadier)
hysteresis = 0            # 0 = switch as soon as the vote does; n > 1 = require n consecutive
                          # windows to agree before the output class changes
